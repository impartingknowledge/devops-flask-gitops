
name: Flask DevOps CI/CD Pipeline

# Trigger pipeline on pushes and pull requests to main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Permissions required by GitHub Actions and AWS OIDC
permissions:
  contents: write
  id-token: write

jobs:
  ci-cd:
    name: Build, Scan, Push and Update Deployment
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install application dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. SonarQube Cloud code quality scan
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 5. Trivy filesystem security scan
      - name: Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          ignore-unfixed: true

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t flask-devops-app:${{ github.sha }} .

      # 7. Trivy Docker image security scan
      - name: Trivy Docker Image Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flask-devops-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          ignore-unfixed: true

      # 8. Debug GitHub OIDC claims
      - name: Debug GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = token.split('.')[1];

            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString('utf8')
            );

            core.info('OIDC subject: ' + claims.sub);
            core.info('OIDC audience: ' + claims.aud);

      # 9. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Tag and push Docker image to Amazon ECR
      - name: Push Docker Image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: flask-devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag flask-devops-app:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

      # 12. Update Kubernetes Deployment image tag
      - name: Update Kubernetes Deployment Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i "s|PLACEHOLDER|${GITHUB_SHA}|g" k8s/deployment.yaml

      # 13. Commit and push updated Kubernetes manifest
      - name: Commit and Push Kubernetes Manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit"
          else
            git commit -m "Update deployment image [skip ci]"
            git push
          fi
