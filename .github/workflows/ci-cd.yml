
name: Flask DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      
permissions:
  contents: read
  id-token: write

jobs:
  security-analysis:
    name: Code Quality and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          ignore-unfixed: true

      
      - name: Build Docker Image
        run: |
          docker build -t flask-devops-app:${{ github.sha }} .

      - name: Trivy Docker Image Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flask-devops-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          ignore-unfixed: true

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${claims.sub}`);
            core.info(`OIDC audience: ${claims.aud}`);

            # put in the actual git > actions > oidc > subject into the aws iam > trusted entity > trust relation ship policy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: flask-devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag flask-devops-app:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

