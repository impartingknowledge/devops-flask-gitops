
apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-devops-app
  namespace: demo

  labels:
    app: flask-devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-devops-app

  template:
    metadata:
      labels:
        app: flask-devops-app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: flask-devops-app

          image: 024171229842.dkr.ecr.ap-south-1.amazonaws.com/flask-devops-app:PLACEHOLDER

          ports:
            - containerPort: 5000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
